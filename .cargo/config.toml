# Faster local builds. Shipping binaries still use `cargo build --release`
# (thin LTO, one codegen unit) from CI / scripts/release.

[alias]
# Opt-level 3, no LTO — much quicker than --release, close enough for daily use.
run-fast = "run --profile release-fast"
build-fast = "build --profile release-fast"

# rust-lld ships with rustc. On Windows MSVC this avoids the slow link.exe
# incremental pass; on Linux it is a no-op if the toolchain already defaults to lld.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

[target.aarch64-pc-windows-msvc]
linker = "rust-lld"

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]
